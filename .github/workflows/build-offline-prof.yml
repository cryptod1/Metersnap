name: Build MeterSnap Offline Prof

on:
  push:
    paths:
      - 'offline-android-prof/**'
      - '.github/workflows/build-offline-prof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Build offline debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: offline-android-prof
      - uses: actions/upload-artifact@v6
        with:
          name: metersnap-offline-prof-debug-apk
          path: offline-android-prof/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
